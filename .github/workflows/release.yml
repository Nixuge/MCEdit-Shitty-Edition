name: Build & Release (Linux, macOS, Windows)

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            platform: macos
          - name: macos-x64
            os: macos-14
            target: x86_64-apple-darwin
            platform: macos
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libxdo-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libvulkan-dev

      - name: Setup MSVC environment (for rc.exe icon embedding)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin mcedit-rs

      - name: Package macOS .app bundle
        if: matrix.platform == 'macos'
        run: |
          chmod +x scripts/build_macos_app.sh
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            VERSION="0.1.0"
          fi
          ./scripts/build_macos_app.sh \
            --binary "target/${{ matrix.target }}/release/mcedit-rs" \
            --out "dist" \
            --version "$VERSION"
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/MCEdit-Unified.app" \
            "dist/MCEdit-Unified-${{ matrix.name }}.zip"

      - name: Package Windows archive
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mcedit-rs.exe" "dist/stage/MCEdit-Unified.exe"
          Compress-Archive -Path "dist/stage/*" -DestinationPath "dist/MCEdit-Unified-${{ matrix.name }}.zip" -Force

      - name: Package Linux archive
        if: matrix.platform == 'linux'
        run: |
          mkdir -p dist/MCEdit-Unified
          cp "target/${{ matrix.target }}/release/mcedit-rs" dist/MCEdit-Unified/mcedit-rs
          chmod +x dist/MCEdit-Unified/mcedit-rs
          cp assets/mcedit_icon.png dist/MCEdit-Unified/mcedit-icon.png
          cat > dist/MCEdit-Unified/mcedit-unified.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=MCEdit Unified
          Comment=Minecraft World Editor
          Exec=mcedit-rs %f
          Icon=mcedit-icon
          Categories=Development;Graphics;3DGraphics;
          Terminal=false
          EOF
          cat > dist/MCEdit-Unified/install.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/icons/hicolor/256x256/apps" "$HOME/.local/share/applications"
          cp "$DIR/mcedit-rs" "$HOME/.local/bin/mcedit-rs"
          chmod +x "$HOME/.local/bin/mcedit-rs"
          cp "$DIR/mcedit-icon.png" "$HOME/.local/share/icons/hicolor/256x256/apps/mcedit-icon.png"
          cp "$DIR/mcedit-unified.desktop" "$HOME/.local/share/applications/mcedit-unified.desktop"
          echo "Installed mcedit-rs to $HOME/.local/bin/mcedit-rs"
          EOF
          chmod +x dist/MCEdit-Unified/install.sh
          tar -czf "dist/MCEdit-Unified-${{ matrix.name }}.tar.gz" -C dist MCEdit-Unified

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCEdit-Unified-${{ matrix.name }}
          path: |
            dist/MCEdit-Unified-*.zip
            dist/MCEdit-Unified-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: sha256sum MCEdit-Unified-* > SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
